name: Vercel Usage Monitor & WhatsApp Alert

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  check-usage:
    runs-on: ubuntu-latest
    steps:
      - name: Query Usage and Trigger Alert
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
        run: |
          curl -s -X GET "https://moviesnet.site/api/cron/check-usage?threshold=95" || true
